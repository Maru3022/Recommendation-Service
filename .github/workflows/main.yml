name: CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Deployment operation
        type: choice
        options: [none, deploy-production, rollback-production]
        default: none
      image_digest:
        description: Existing GHCR digest (sha256:...) for production deploy or rollback
        required: false
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  JAVA_VERSION: '21'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/recommendation-service
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify unit and integration tests
        run: mvn -B -ntp clean verify -Pintegration-tests
      - name: Install kubectl
        shell: bash
        run: |
          version=v1.30.2
          base="https://dl.k8s.io/release/${version}/bin/linux/amd64"
          curl --fail --silent --show-error --location --output kubectl "${base}/kubectl"
          curl --fail --silent --show-error --location --output kubectl.sha256 "${base}/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Install kubeconform
        shell: bash
        run: |
          version=0.6.7
          base="https://github.com/yannh/kubeconform/releases/download/v${version}"
          curl --fail --silent --show-error --location --output kubeconform.tar.gz "${base}/kubeconform-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --output CHECKSUMS "${base}/CHECKSUMS"
          grep 'kubeconform-linux-amd64.tar.gz' CHECKSUMS | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform
      - name: Render and validate Kubernetes overlays
        run: |
          kubectl kustomize k8s/overlays/staging > rendered-staging.yaml
          kubectl kustomize k8s/overlays/production > rendered-production.yaml
          ./kubeconform -strict -summary -ignore-missing-schemas rendered-staging.yaml rendered-production.yaml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recommendation-test-reports-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish immutable image
        id: publish
        run: |
          image="${IMAGE_NAME,,}"
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "${image}:${GITHUB_SHA}" .
          push_output="$(docker push "${image}:${GITHUB_SHA}")"
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | awk '/digest: sha256:/ {print $2}' | tail -1)"
          test -n "$digest"
          echo "image=${image}@${digest}" >> "$GITHUB_OUTPUT"
  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: recommendation-staging
      cancel-in-progress: false
    environment: staging
    steps:
      - name: Install kubectl
        shell: bash
        run: |
          version=v1.30.2
          base="https://dl.k8s.io/release/${version}/bin/linux/amd64"
          curl --fail --silent --show-error --location --output kubectl "${base}/kubectl"
          curl --fail --silent --show-error --location --output kubectl.sha256 "${base}/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Configure Kubernetes
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          test -n "$KUBECONFIG_B64"
          mkdir -p "$RUNNER_TEMP/kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Deploy published digest
        run: |
          kubectl set image deployment/recommendation-service recommendation-service="${{ needs.publish.outputs.image }}" -n recommendation-staging
          kubectl rollout status deployment/recommendation-service -n recommendation-staging --timeout=180s
      - name: Smoke test service readiness
        run: |
          kubectl -n recommendation-staging port-forward service/recommendation-service 18026:80 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for attempt in {1..30}; do
            curl --fail --silent --show-error http://127.0.0.1:18026/actuator/health/readiness && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/port-forward.log"
          exit 1
  production:
    name: Production deploy or rollback
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'none'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: recommendation-production
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate digest
        run: |
          [[ "${{ inputs.image_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
      - name: Install kubectl
        shell: bash
        run: |
          version=v1.30.2
          base="https://dl.k8s.io/release/${version}/bin/linux/amd64"
          curl --fail --silent --show-error --location --output kubectl "${base}/kubectl"
          curl --fail --silent --show-error --location --output kubectl.sha256 "${base}/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Configure Kubernetes
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
        run: |
          test -n "$KUBECONFIG_B64"
          mkdir -p "$RUNNER_TEMP/kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Deploy selected digest
        run: |
          image="${IMAGE_NAME,,}@${{ inputs.image_digest }}"
          kubectl set image deployment/recommendation-service recommendation-service="$image" -n recommendation-production
          kubectl rollout status deployment/recommendation-service -n recommendation-production --timeout=300s


# Loaded inside the image's http context. Requires nginx >= 1.27.3.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;
upstream fitflow_gateway {
    zone fitflow_gateway 64k;
    server api-gateway:8075 resolve;
    keepalive 32;
}
map $uri $auth_limit_key {
    default "";
    ~^/api/v1/auth/ $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth_per_ip:10m rate=5r/s;
log_format fitflow escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"duration":$request_time,"upstream_duration":"$upstream_response_time",'
    '"upstream_status":"$upstream_status"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log fitflow;

    # Match the backend multipart request limit (25 MB/file, 75 MB/request).
    client_max_body_size 75m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /actuator { return 404; }
    location ^~ /actuator/ { return 404; }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
    # CRA gives build assets content hashes; never cache index.html as immutable.
    location /static/ {
        expires 1y;
        try_files $uri =404;
    }
    location ^~ /api/ {
        limit_req zone=auth_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://fitflow_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the outermost proxy: discard spoofed client forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Correlation-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # Never replay writes after an ambiguous failure.
        proxy_next_upstream off;
        proxy_cache off;
    }
}
